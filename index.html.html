function deriveLastDate(label) {
  const now = new Date();
  const toISO = (d) => d.toISOString().slice(0, 10);
  if (label.includes("AM") || label.includes("PM")) return toISO(now);
  if (label === "Yesterday") {
    const d = new Date(now);
    d.setDate(d.getDate() - 1);
    return toISO(d);
  }
  const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const idx = days.indexOf(label);
  if (idx >= 0) {
    const d = new Date(now);
    let diff = (d.getDay() - idx + 7) % 7;
    if (diff === 0) diff = 7;
    d.setDate(d.getDate() - diff);
    return toISO(d);
  }
  return toISO(now);
}

function fmtSize(bytes) {
  if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  return Math.max(1, Math.round(bytes / 1024)) + " KB";
}
function nowTime() {
  return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
function nowActivityTime() {
  return `Today \u00B7 ${nowTime()}`;
}
function dateBucket(lastTime) {
  if (lastTime.includes("AM") || lastTime.includes("PM")) return "today";
  if (lastTime === "Yesterday") return "yesterday";
  return "week";
}
function lastMessageSender(conv) {
  for (let i = conv.messages.length - 1; i >= 0; i--) {
    const m = conv.messages[i];
    if (m.type !== "note") return m.sender;
  }
  return null;
}
function firstName(name) {
  return name.split(" ")[0];
}
function fileGlyph(ext) {
  if (ext === "pdf") return FileType2;
  if (["jpg", "jpeg", "png", "gif"].includes(ext)) return ImageIcon;
  if (ext === "mp3") return Music;
  return FileText;
}

function Tooltip({ label, children, side = "bottom" }) {
  const pos = side === "bottom" ? "top-full mt-2" : side === "right" ? "left-full ml-2 top-1/2 -translate-y-1/2" : "bottom-full mb-2";
  return (
    <div className="relative group inline-flex">
      {children}
      <span className={`pointer-events-none absolute ${pos} left-1/2 -translate-x-1/2 w-44 text-center leading-snug rounded-md bg-gray-900 px-2 py-1 text-xs text-white opacity-0 group-hover:opacity-100 transition-opacity z-50 shadow-lg`}>
        {label}
      </span>
    </div>
  );
}

function Avatar({ initials, color, size = 9, online, ring }) {
  const dim = AVATAR_SIZES[size] || AVATAR_SIZES[9];
  return (
    <div className={`relative shrink-0 ${dim}`}>
      <div className={`${dim} rounded-full flex items-center justify-center font-semibold text-xs ${color} ${ring ? "ring-2 ring-white" : ""}`}>
        {initials}
      </div>
      {online && <span className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-white" />}
    </div>
  );
}

function ToastStack({ toasts }) {
  return (
    <div className="fixed bottom-5 right-5 flex flex-col gap-2 items-end" style={{ zIndex: 100 }}>
      {toasts.map((t) => (
        <div key={t.id} className={`flex items-center gap-2 rounded-lg border px-3 py-2 text-sm shadow-lg bg-white animate-pulse-once ${t.type === "error" ? "border-red-200 text-red-700" : "border-emerald-200 text-gray-800"}`}>
          {t.type === "error" ? <AlertCircle className="w-4 h-4 text-red-500 shrink-0" /> : <Check className="w-4 h-4 text-emerald-500 shrink-0" />}
          <span>{t.message}</span>
        </div>
      ))}
    </div>
  );
}

        <div className="mt-5 flex justify-end gap-2">
          <button onClick={onCancel} className="px-3 py-1.5 text-sm rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50">Cancel</button>
          <button onClick={onConfirm} className={`px-3 py-1.5 text-sm rounded-md text-white ${danger ? "bg-red-600 hover:bg-red-700" : "bg-orange-600 hover:bg-orange-700"}`}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Conversation list                                                    */
/* ------------------------------------------------------------------ */

function ConversationList({
  conversations, selectedId, onSelect, query, setQuery, filter, setFilter,
  agentFilters, setAgentFilters, dateFilter, setDateFilter, customDateFrom, setCustomDateFrom, customDateTo, setCustomDateTo,
  favoriteFilter, setFavoriteFilter, activityFilter, setActivityFilter,
  selectedIds, onToggleSelectId, onSelectAll, onBulkMarkRead, onBulkMarkUnread, onBulkArchive, onUnarchiveOne, onToggleFavoriteOne,
}) {
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [agentSectionOpen, setAgentSectionOpen] = useState(false);
  const [agentSearch, setAgentSearch] = useState("");

  const totalUnread = conversations.reduce((s, c) => s + (c.archived ? 0 : c.unread), 0);
  const filtered = conversations.filter((c) => {
    const q = query.trim().toLowerCase();
    if (q && !(c.name.toLowerCase().includes(q) || c.lastMessage.toLowerCase().includes(q))) return false;
    if (filter === "Archived") {
      if (!c.archived) return false;
    } else {
      if (c.archived) return false;
      if (filter === "Unread" && c.unread === 0) return false;
      if (filter === "Recent" && !(c.lastTime.includes("AM") || c.lastTime.includes("PM"))) return false;
    }
    if (agentFilters.length > 0) {
      const matches = agentFilters.some((af) => (af === "Unassigned" ? !c.assignedAgent : c.assignedAgent === af));
      if (!matches) return false;
    }
    if (dateFilter === "custom") {
      if (customDateFrom && c.lastDate < customDateFrom) return false;
      if (customDateTo && c.lastDate > customDateTo) return false;
    } else if (dateFilter !== "all" && dateBucket(c.lastTime) !== dateFilter) return false;
    if (favoriteFilter && !c.favorite) return false;
    if (activityFilter !== "all" && lastMessageSender(c) !== activityFilter) return false;
    return true;
  });

  const agentOptions = AGENTS.filter((a) => a.toLowerCase().includes(agentSearch.toLowerCase()));
  const toggleAgentFilter = (value) => {
    setAgentFilters((prev) => (prev.includes(value) ? prev.filter((v) => v !== value) : [...prev, value]));
  };
  const activeFilterCount = (dateFilter !== "all" ? 1 : 0) + agentFilters.length + (favoriteFilter ? 1 : 0) + (filter === "Archived" ? 1 : 0) + (activityFilter !== "all" ? 1 : 0);
  const clearAllFilters = () => {
    setDateFilter("all");
    setCustomDateFrom("");
    setCustomDateTo("");
    setAgentFilters([]);
    setFavoriteFilter(false);
    setActivityFilter("all");
    if (filter === "Archived") setFilter("All");
  };
  const allVisibleSelected = filtered.length > 0 && filtered.every((c) => selectedIds.includes(c.id));

  return (
    <div className="w-80 shrink-0 h-full flex flex-col bg-white border-r border-gray-200">
      <div className="px-4 pt-4 pb-3 flex items-center justify-between">
        <h1 className="text-lg font-semibold text-gray-900">Messages</h1>
        <Tooltip label="Opens a new conversation from your contact list">
          <button className="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-orange-600 text-white text-xs font-medium cursor-default">
            <Plus className="w-3.5 h-3.5" /> New Message
          </button>
        </Tooltip>
      </div>
      <div className="px-4 pb-3">
        <div className="relative">
          <Search className="w-4 h-4 text-gray-400 absolute left-2.5 top-1/2 -translate-y-1/2" />
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="Search contacts or messages"
            className="w-full pl-8 pr-3 py-2 text-sm rounded-md border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-200 focus:border-orange-400 placeholder:text-gray-400"
          />
        </div>
      </div>
      <div className="px-4 pb-3 flex items-center gap-1.5 flex-wrap">
        {["All", "Unread", "Recent"].map((f) => (
          <button
            key={f}
            onClick={() => setFilter(f)}
            className={`px-2.5 py-1 rounded-full text-xs font-medium border transition-colors ${filter === f ? "bg-orange-600 text-white border-orange-600" : "border-gray-200 text-gray-600 hover:bg-gray-50"}`}
          >
            {f}{f === "Unread" && totalUnread > 0 ? ` \u00B7 ${totalUnread}` : ""}
          </button>
        ))}

        <div className="relative">
          <Tooltip label="More filters">
            <button
              onClick={() => setFiltersOpen((v) => !v)}
              className={`relative w-7 h-7 rounded-full border flex items-center justify-center transition-colors ${activeFilterCount > 0 ? "bg-orange-600 border-orange-600 text-white" : "border-gray-200 text-gray-500 hover:bg-gray-50"}`}
            >
              <Filter className="w-3.5 h-3.5" />
              {activeFilterCount > 0 && (
                <span className="absolute -top-1.5 -right-1.5 min-w-[16px] h-4 px-1 rounded-full bg-gray-900 text-white text-[10px] font-semibold flex items-center justify-center">
                  {activeFilterCount}
                </span>
              )}
            </button>
          </Tooltip>

          {filtersOpen && (
            <div className="absolute left-0 top-full mt-2 w-72 bg-white rounded-lg border border-gray-200 shadow-xl z-20 flex flex-col max-h-96">
              <div className="flex items-center justify-between px-3 pt-3 pb-2 shrink-0">
                <span className="text-sm font-semibold text-gray-900">Filters</span>
                {activeFilterCount > 0 && (
                  <button onClick={clearAllFilters} className="text-xs text-orange-600 font-medium hover:underline">Clear all</button>
                )}
              </div>

              <div className="px-3 overflow-y-auto flex-1 min-h-0">
                <div className="mb-3">
                  <div className="text-[10px] font-semibold text-gray-400 uppercase tracking-wide mb-1.5">Date</div>
                  <div className="flex flex-wrap gap-1.5">
                    {DATE_OPTIONS.map((d) => (
                      <button
                        key={d.id}
                        onClick={() => setDateFilter(d.id)}
                        className={`px-2.5 py-1 rounded-full text-xs font-medium border transition-colors ${dateFilter === d.id ? "bg-orange-600 text-white border-orange-600" : "border-gray-200 text-gray-600 hover:bg-gray-50"}`}
                      >
                        {d.label}
                      </button>
                    ))}
                  </div>
                  {dateFilter === "custom" && (
                    <div className="flex items-center gap-2 mt-2">
                      <div className="flex-1">
                        <label className="block text-[10px] text-gray-400 mb-0.5">From</label>
                        <input
                          type="date"
                          value={customDateFrom}
                          onChange={(e) => setCustomDateFrom(e.target.value)}
                          className="w-full px-2 py-1.5 text-xs rounded-md border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-200"
                        />
                      </div>
                      <div className="flex-1">
                        <label className="block text-[10px] text-gray-400 mb-0.5">To</label>
                        <input
                          type="date"
                          value={customDateTo}
                          onChange={(e) => setCustomDateTo(e.target.value)}
                          className="w-full px-2 py-1.5 text-xs rounded-md border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-200"
                        />
                      </div>
                    </div>
                  )}
                </div>

                <div className="mb-3">
                  <div className="text-[10px] font-semibold text-gray-400 uppercase tracking-wide mb-1.5">Show</div>
                  <div className="flex flex-wrap gap-1.5">
                    <button
                      onClick={() => setFavoriteFilter((v) => !v)}
                      className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border transition-colors ${favoriteFilter ? "bg-orange-600 text-white border-orange-600" : "border-gray-200 text-gray-600 hover:bg-gray-50"}`}
                    >
                      <Star className={`w-3 h-3 ${favoriteFilter ? "fill-white" : ""}`} />
                      Favorites
                    </button>
                    <button
                      onClick={() => setFilter(filter === "Archived" ? "All" : "Archived")}
                      className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border transition-colors ${filter === "Archived" ? "bg-orange-600 text-white border-orange-600" : "border-gray-200 text-gray-600 hover:bg-gray-50"}`}
                    >
                      <Archive className="w-3 h-3" />
                      Archived
                    </button>
                  </div>
                </div>

                <div className="mb-3">
                  <div className="text-[10px] font-semibold text-gray-400 uppercase tracking-wide mb-1.5">Activity</div>
                  <div className="flex flex-wrap gap-1.5">
                    {[
                      { id: "all", label: "All" },
                      { id: "agent", label: "Sent", icon: Send },
                      { id: "customer", label: "Replies", icon: MessageSquare },
                    ].map((a) => (
                      <button
                        key={a.id}
                        onClick={() => setActivityFilter(a.id)}
                        className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border transition-colors ${activityFilter === a.id ? "bg-orange-600 text-white border-orange-600" : "border-gray-200 text-gray-600 hover:bg-gray-50"}`}
                      >
                        {a.icon && <a.icon className="w-3 h-3" />}
                        {a.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="mb-3">
                  <div className="text-[10px] font-semibold text-gray-400 uppercase tracking-wide mb-1.5">Agent</div>
                  <button
                    onClick={() => setAgentSectionOpen((v) => !v)}
                    className="w-full flex items-center justify-between px-2.5 py-1.5 rounded-md border border-gray-200 text-sm text-gray-700 hover:bg-gray-50"
                  >
                    <span>{agentFilters.length === 0 ? "Any agent" : agentFilters.length === 1 ? agentFilters[0] : `${agentFilters.length} agents selected`}</span>
                    <ChevronDown className={`w-3.5 h-3.5 text-gray-400 transition-transform ${agentSectionOpen ? "rotate-180" : ""}`} />
                  </button>

                  {agentSectionOpen && (
                    <div className="mt-1.5">
                      <div className="relative mb-1.5">
                        <Search className="w-3.5 h-3.5 text-gray-400 absolute left-2.5 top-1/2 -translate-y-1/2" />
                        <input
                          autoFocus
                          value={agentSearch}
                          onChange={(e) => setAgentSearch(e.target.value)}
                          placeholder="Search agents..."
                          className="w-full pl-7 pr-2 py-1.5 text-sm rounded-md border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-200"
                        />
                      </div>
                      <div className="max-h-28 overflow-y-auto space-y-0.5">
                        <button
                          onClick={() => toggleAgentFilter("Unassigned")}
                          className="w-full flex items-center gap-2.5 px-2 py-1.5 text-sm rounded-md hover:bg-orange-50 text-left text-gray-700"
                        >
                          <span className={`w-4 h-4 rounded border flex items-center justify-center shrink-0 ${agentFilters.includes("Unassigned") ? "bg-orange-600 border-orange-600" : "border-gray-300"}`}>
                            {agentFilters.includes("Unassigned") && <Check className="w-3 h-3 text-white" />}
                          </span>
                          Unassigned
                        </button>
                        {agentOptions.length === 0 && <div className="px-2 py-2 text-xs text-gray-400 text-center">No agents found</div>}
                        {agentOptions.map((a) => (
                          <button
                            key={a}
                            onClick={() => toggleAgentFilter(a)}
                            className="w-full flex items-center gap-2.5 px-2 py-1.5 text-sm rounded-md hover:bg-orange-50 text-left text-gray-700"
                          >
                            <span className={`w-4 h-4 rounded border flex items-center justify-center shrink-0 ${agentFilters.includes(a) ? "bg-orange-600 border-orange-600" : "border-gray-300"}`}>
                              {agentFilters.includes(a) && <Check className="w-3 h-3 text-white" />}
                            </span>
                            <Avatar initials={a.split(" ").map((p) => p[0]).join("")} color="bg-gray-100 text-gray-600" size={6} />
                            {a}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <div className="px-3 pt-2 pb-3 border-t border-gray-100 shrink-0">
                <button onClick={() => setFiltersOpen(false)} className="w-full py-1.5 rounded-md bg-orange-600 text-white text-sm font-medium hover:bg-orange-700">
                  Apply
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
      {filtersOpen && <div className="fixed inset-0 z-10" onClick={() => setFiltersOpen(false)} />}

      <div className={`px-4 py-2 border-b flex items-center justify-between gap-2 transition-colors ${selectedIds.length > 0 ? "bg-orange-50 border-orange-100" : "border-gray-100"}`}>
        <button onClick={() => onSelectAll(!allVisibleSelected, filtered.map((c) => c.id))} className="flex items-center gap-2 text-xs text-gray-500 hover:text-gray-700">
          <span className={`w-4 h-4 rounded border flex items-center justify-center shrink-0 ${allVisibleSelected ? "bg-orange-600 border-orange-600" : "border-gray-300 bg-white"}`}>
            {allVisibleSelected && <Check className="w-3 h-3 text-white" />}
          </span>
          {selectedIds.length > 0 ? `${selectedIds.length} selected` : "Select all"}
        </button>
        {selectedIds.length > 0 && (
          <div className="flex items-center gap-1">
            <Tooltip label="Mark as read">
              <button onClick={onBulkMarkRead} className="w-7 h-7 rounded-md flex items-center justify-center text-gray-500 hover:bg-white">
                <Eye className="w-4 h-4" />
              </button>
            </Tooltip>
            <Tooltip label="Mark as unread">
              <button onClick={onBulkMarkUnread} className="w-7 h-7 rounded-md flex items-center justify-center text-gray-500 hover:bg-white">
                <EyeOff className="w-4 h-4" />
              </button>
            </Tooltip>
            <Tooltip label="Archive">
              <button onClick={onBulkArchive} className="w-7 h-7 rounded-md flex items-center justify-center text-gray-500 hover:bg-white">
                <Archive className="w-4 h-4" />
              </button>
            </Tooltip>
          </div>
        )}
      </div>

      <div className="flex-1 overflow-y-auto overflow-x-hidden">
        {filtered.length === 0 && (
          <div className="px-4 py-10 text-center text-sm text-gray-400">
            {filter === "Archived" ? "No archived conversations." : `No conversations match${query ? ` "${query}"` : " this filter"}.`}
          </div>
        )}
        {filtered.map((c) => {
          const isSelected = selectedIds.includes(c.id);
          return (
            <div
              key={c.id}
              role="button"
              tabIndex={0}
              onClick={() => onSelect(c.id)}
              onKeyDown={(e) => { if (e.key === "Enter") onSelect(c.id); }}
              className={`group w-full text-left px-4 py-3 flex items-start gap-3 border-b border-b-gray-50 border-l-2 transition-colors cursor-pointer ${selectedId === c.id ? "bg-orange-50 border-l-orange-500" : isSelected ? "bg-orange-50/50 border-l-transparent" : "border-l-transparent hover:bg-gray-50"}`}
            >
              <div className="relative shrink-0 w-9 h-9">
                <div className={`transition-opacity ${isSelected ? "opacity-0" : "opacity-100 group-hover:opacity-0"}`}>
                  <Avatar initials={c.initials} color={c.color} size={9} online={c.online} />
                </div>
                <button
                  onClick={(e) => { e.stopPropagation(); onToggleSelectId(c.id); }}
                  className={`absolute inset-0 flex items-center justify-center transition-opacity ${isSelected ? "opacity-100" : "opacity-0 group-hover:opacity-100"}`}
                >
                  <span className={`w-6 h-6 rounded-full border-2 flex items-center justify-center bg-white ${isSelected ? "border-orange-600" : "border-gray-300"}`}>
                    {isSelected && <span className="w-2.5 h-2.5 rounded-full bg-orange-600" />}
                  </span>
                </button>
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between gap-2">
                  <span className={`text-sm truncate ${c.unread > 0 ? "font-semibold text-gray-900" : "font-medium text-gray-800"}`}>{c.name}</span>
                  <span className="text-xs text-gray-400 shrink-0">{c.lastTime}</span>
                </div>
                <div className="flex items-center justify-between gap-2 mt-0.5">
                  <p className={`text-xs truncate ${c.unread > 0 ? "text-gray-700" : "text-gray-400"}`}>{c.lastMessage}</p>
                  <div className="flex items-center gap-1 shrink-0">
                    {c.muted && <BellOff className="w-3 h-3 text-gray-300" />}
                    <button
                      onClick={(e) => { e.stopPropagation(); onToggleFavoriteOne(c.id); }}
                      title={c.favorite ? "Remove from favorites" : "Add to favorites"}
                      className={`transition-opacity ${c.favorite ? "opacity-100" : "opacity-0 group-hover:opacity-100"}`}
                    >
                      <Star className={`w-3.5 h-3.5 ${c.favorite ? "text-orange-400 fill-orange-400" : "text-gray-300 hover:text-orange-400"}`} />
                    </button>
                    {c.unread > 0 && <span className="min-w-[18px] h-[18px] px-1 rounded-full bg-orange-600 text-white text-[10px] font-semibold flex items-center justify-center">{c.unread}</span>}
                  </div>
                </div>
                <div className="flex items-center gap-1.5 mt-1">
                  {c.assignedAgent && <span className="inline-block text-[10px] px-1.5 py-0.5 rounded bg-orange-50 text-orange-700 border border-orange-200">{c.assignedAgent}</span>}
                  {c.archived && (
                    <span
                      role="button"
                      tabIndex={0}
                      onClick={(e) => { e.stopPropagation(); onUnarchiveOne(c.id); }}
                      className="inline-block text-[10px] px-1.5 py-0.5 rounded bg-white text-orange-600 border border-orange-200 font-medium hover:bg-orange-50"
                    >
                      Unarchive
                    </span>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Message bubble                                                       */
/* ------------------------------------------------------------------ */

function MessageBubble({ msg }) {
  if (msg.type === "note") {
    const Glyph = msg.attachment ? fileGlyph(msg.attachment.ext) : null;
    return (
      <div className="flex justify-center mb-3">
        <div className="max-w-md w-full rounded-lg border border-amber-200 bg-amber-50 px-3.5 py-2.5">
          <div className="flex items-center gap-1.5 text-[11px] font-semibold text-amber-700 mb-1">
            <Edit3 className="w-3 h-3" /> Internal Note · {CURRENT_AGENT.name}
          </div>
          {msg.attachment ? (
            <div className="flex items-center gap-2.5" style={{ minWidth: "200px" }}>
              <div className="w-9 h-9 rounded-md bg-white border border-amber-200 flex items-center justify-center shrink-0">
                <Glyph className="w-4 h-4 text-amber-600" />
              </div>
              <div className="min-w-0">
                <div className="text-sm font-medium text-gray-800 truncate">{msg.attachment.name}</div>
                <div className="text-xs text-gray-400 uppercase">{msg.attachment.ext} · {fmtSize(msg.attachment.size)}</div>
              </div>
            </div>
          ) : (
            <p className="text-sm text-gray-800 leading-relaxed">{msg.text}</p>
          )}
          <div className="text-[11px] text-amber-500 mt-1">{msg.time}</div>
        </div>
      </div>
    );
  }

  const isAgent = msg.sender === "agent";
  const Glyph = msg.attachment ? fileGlyph(msg.attachment.ext) : null;
  return (
    <div className={`flex ${isAgent ? "justify-end" : "justify-start"} mb-3`}>
      <div className={`max-w-md ${isAgent ? "items-end" : "items-start"} flex flex-col`}>
        <div className={`rounded-lg px-3.5 py-2.5 text-sm leading-relaxed ${isAgent ? "bg-orange-50 text-gray-900 border border-orange-100" : "bg-white text-gray-900 border border-gray-200"}`}>
          {msg.attachment ? (
            <div className="flex items-center gap-2.5" style={{ minWidth: "200px" }}>
              <div className="w-9 h-9 rounded-md bg-white border border-gray-200 flex items-center justify-center shrink-0">
                <Glyph className="w-4 h-4 text-gray-500" />
              </div>
              <div className="min-w-0">
                <div className="text-sm font-medium text-gray-800 truncate">{msg.attachment.name}</div>
                <div className="text-xs text-gray-400 uppercase">{msg.attachment.ext} · {fmtSize(msg.attachment.size)}</div>
              </div>
            </div>
          ) : (
            <span>{msg.text}</span>
          )}
        </div>
        <div className="flex items-center gap-1 mt-1 px-1">
          <span className="text-[11px] text-gray-400">{msg.time}</span>
          {isAgent && msg.status && <span className="text-[11px] text-gray-400">· {msg.status}</span>}
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Popovers used in header + composer                                   */
/* ------------------------------------------------------------------ */

function SummaryPopover({ conv, onClose }) {
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    setLoading(true);
    const t = setTimeout(() => setLoading(false), 700);
    return () => clearTimeout(t);
  }, [conv.id]);

  const regenerate = () => {
    setLoading(true);
    setTimeout(() => setLoading(false), 700);
  };

  return (
    <div className="absolute right-0 top-full mt-2 w-80 bg-white rounded-lg border border-gray-200 shadow-xl z-20">
      <div className="flex items-center justify-between px-3.5 pt-3 pb-2">
        <div className="flex items-center gap-1.5">
          <Sparkles className="w-3.5 h-3.5 text-orange-500" />
          <span className="text-sm font-semibold text-gray-900">Conversation Summary</span>
        </div>
        <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X className="w-4 h-4" /></button>
      </div>

      <div className="px-3.5 pb-3.5">
        {loading ? (
          <div className="flex items-center gap-2 text-sm text-gray-500 py-3">
            <Loader2 className="w-4 h-4 animate-spin text-orange-500" /> Summarizing conversation...
          </div>
        ) : (
          <>
            <ul className="space-y-2">
              {(conv.summary || []).map((point, i) => (
                <li key={i} className="flex items-start gap-2 text-sm text-gray-700">
                  <span className="w-1.5 h-1.5 rounded-full bg-orange-400 mt-1.5 shrink-0" />
                  {point}
                </li>
              ))}
            </ul>
            <div className="flex items-center justify-between mt-3 pt-2.5 border-t border-gray-100">
              <span className="text-[10px] text-gray-400">AI-generated \u00B7 may need review</span>
              <button onClick={regenerate} className="flex items-center gap-1 text-xs text-orange-600 font-medium hover:underline">
                <RefreshCw className="w-3 h-3" /> Regenerate
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

  const filtered = AGENTS.filter((a) => a.toLowerCase().includes(search.toLowerCase()));
  return (
    <div className="absolute right-0 top-full mt-2 w-64 bg-white rounded-lg border border-gray-200 shadow-xl z-20 p-2">
      <div className="px-1 pb-2 text-xs font-semibold text-gray-500">Assign Agent</div>
      <div className="relative mb-1.5">
        <Search className="w-3.5 h-3.5 text-gray-400 absolute left-2.5 top-1/2 -translate-y-1/2" />
        <input autoFocus value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search agents..." className="w-full pl-7 pr-2 py-1.5 text-sm rounded-md border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-200" />
      </div>
      <div className="max-h-48 overflow-y-auto">
        {filtered.length === 0 && <div className="px-2 py-3 text-xs text-gray-400 text-center">No agents found</div>}
        {filtered.map((a) => (
          <button key={a} onClick={() => onPick(a)} className="w-full text-left px-2.5 py-1.5 text-sm rounded-md hover:bg-orange-50 flex items-center gap-2 text-gray-700">

}

      iconClass: conv.favorite ? "text-orange-500 fill-orange-500" : "text-gray-500",

    {
      icon: BellOff,
      title: conv.muted ? "Unmute Notifications" : "Mute Notifications",
      subtitle: conv.muted ? "Resume alerts for new messages." : "Stop alerts for new messages.",
      onClick: onToggleMute,

  return (
    <div
      className="absolute right-0 top-full mt-2 w-64 bg-white rounded-lg border border-gray-200 shadow-xl z-20 py-1.5"

          <div className="min-w-0">

          <div className="text-sm text-gray-800 leading-tight">Archive Conversation</div>
          <div className="text-[11px] text-gray-400 leading-tight">Move out of your inbox. Find it later under Archived.</div>

      </button>
      <style>{`@keyframes fadeDown{from{opacity:0;transform:translateY(-4px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}`}</style>

function Composer({ conv, onSend, addToast, activePopover, setActivePopover, mode, setMode }) {
  const [text, setText] = useState("");
  const [attachments, setAttachments] = useState([]);
  const [templateSearch, setTemplateSearch] = useState("");
  const [aiState, setAiState] = useState(null); // null | 'loading' | 'ready'
  const [aiAction, setAiAction] = useState(null);
  const [dragging, setDragging] = useState(false);
  const [scheduleDate, setScheduleDate] = useState("");
  const [scheduleTime, setScheduleTime] = useState("");
  const fileInputRef = useRef(null);

  useEffect(() => {
    setText(""); setAttachments([]); setAiState(null); setAiAction(null); setActivePopover(null); setMode("reply");
  }, [conv.id]);

  const handleFiles = (files) => {
    Array.from(files).forEach((file) => {
      const ext = file.name.split(".").pop().toLowerCase();
      if (!ALLOWED_EXT.includes(ext)) { addToast("File type not supported", "error"); return; }
      if (file.size > MAX_FILE_BYTES) { addToast("File exceeds 5 MB limit", "error"); return; }
      setAttachments((prev) => [...prev, { id: nextId(), name: file.name, size: file.size, ext }]);
      addToast("File uploaded successfully", "success");
    });
  };

  const doSend = () => {
    if (!text.trim() && attachments.length === 0) return;
    onSend({ text: text.trim(), attachments, type: mode === "note" ? "note" : "message" });
    setText(""); setAttachments([]); setAiState(null); setAiAction(null); setActivePopover(null);
  };

  const insertTemplate = (body) => {
    setText(body.replace("{name}", firstName(conv.name)));
    setActivePopover(null);
    addToast("Template inserted", "success");
  };

  const runAiAssist = (action) => {
    setActivePopover(null);
    setAiAction(action);
    setAiState("loading");
    setTimeout(() => setAiState("ready"), 900);
  };

  const allTemplates = Object.entries(TEMPLATES).flatMap(([cat, items]) => items.map((t) => ({ ...t, cat })))
    .filter((t) => t.name.toLowerCase().includes(templateSearch.toLowerCase()));

  return (
    <div className="border-t border-gray-200 bg-white px-5 py-3">
      {aiState && aiAction && (
        <div className="mb-2 rounded-lg border border-orange-200 bg-orange-50 p-3">
          {aiState === "loading" ? (
            <div className="flex items-center gap-2 text-sm text-orange-700">
              <Loader2 className="w-4 h-4 animate-spin" /> {aiAction.label}...
            </div>
          ) : (
            <div>
              <div className="flex items-center gap-1.5 text-xs font-semibold text-orange-700 mb-1.5">
                <Sparkles className="w-3.5 h-3.5" /> {aiAction.header}
              </div>
              <p className="text-sm text-gray-800 mb-2.5">{aiAction.output}</p>
              <div className="flex gap-2">
                <button onClick={() => { setAiState(null); setAiAction(null); }} className="px-2.5 py-1 text-xs rounded-md border border-gray-300 text-gray-600 hover:bg-white">Dismiss</button>
                <button onClick={() => { setText(aiAction.output); setAiState(null); setAiAction(null); addToast("Suggestion inserted \u2014 edit as needed", "success"); }} className="px-2.5 py-1 text-xs rounded-md border border-orange-300 text-orange-700 bg-white hover:bg-orange-100">Edit</button>
                <button onClick={() => { setText(aiAction.output); setAiState(null); setAiAction(null); addToast("Suggestion accepted", "success"); }} className="px-2.5 py-1 text-xs rounded-md bg-orange-600 text-white hover:bg-orange-700">Accept</button>
              </div>
            </div>
          )}
        </div>
      )}

      <div
        onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
        onDragLeave={() => setDragging(false)}
        onDrop={(e) => { e.preventDefault(); setDragging(false); handleFiles(e.dataTransfer.files); }}
        className={`rounded-lg border transition-colors ${dragging ? "border-orange-400 bg-orange-50" : mode === "note" ? "border-amber-200 bg-amber-50/50" : "border-gray-200"}`}
      >
        <div className="flex items-center gap-2 px-3 pt-2.5">
          <div className="relative">
            <button
              onClick={() => setActivePopover(activePopover === "composerMode" ? null : "composerMode")}
              className={`flex items-center gap-1.5 pl-2 pr-1.5 py-1 rounded-md border text-xs font-medium ${mode === "note" ? "border-amber-200 bg-amber-50 text-amber-700" : "border-orange-200 bg-orange-50 text-orange-700"}`}
            >
              {mode === "note" ? <Edit3 className="w-3.5 h-3.5" /> : <Mail className="w-3.5 h-3.5" />}
              {mode === "note" ? "Note" : "Reply"}
              <ChevronDown className="w-3 h-3" />
            </button>
            {activePopover === "composerMode" && (
              <div className="absolute left-0 top-full mt-1.5 w-36 bg-white rounded-lg border border-gray-200 shadow-xl z-20 py-1.5">
                <button onClick={() => { setMode("reply"); setActivePopover(null); }} className={`w-full text-left px-3 py-1.5 text-sm flex items-center gap-2 hover:bg-gray-50 ${mode === "reply" ? "text-orange-700 font-medium" : "text-gray-600"}`}>
                  <Mail className="w-3.5 h-3.5" /> Reply
                </button>
                <button onClick={() => { setMode("note"); setActivePopover(null); }} className={`w-full text-left px-3 py-1.5 text-sm flex items-center gap-2 hover:bg-gray-50 ${mode === "note" ? "text-amber-700 font-medium" : "text-gray-600"}`}>
                  <Edit3 className="w-3.5 h-3.5" /> Note
                </button>
              </div>
            )}
          </div>
          {mode === "note" && <span className="text-[11px] text-amber-600">Only visible to your team, not sent to the customer</span>}
        </div>

        {attachments.length > 0 && (
          <div className="flex flex-wrap gap-2 px-3 pt-3">
            {attachments.map((a) => {
              const Glyph = fileGlyph(a.ext);
              return (
                <div key={a.id} className="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-md pl-2 pr-1.5 py-1.5">
                  <Glyph className="w-4 h-4 text-gray-400" />
                  <div className="text-xs">
                    <div className="text-gray-700 font-medium truncate" style={{ maxWidth: "140px" }}>{a.name}</div>
                    <div className="text-gray-400">{fmtSize(a.size)}</div>
                  </div>
                  <button onClick={() => setAttachments((prev) => prev.filter((x) => x.id !== a.id))} className="text-gray-400 hover:text-gray-600 ml-1">
                    <X className="w-3.5 h-3.5" />
                  </button>
                </div>
              );
            })}
          </div>
        )}

        <textarea
          value={text}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doSend(); } }}
          placeholder={dragging ? "Drop files to attach..." : mode === "note" ? "Add an internal note..." : "Type a message..."}
          rows={2}
          className="w-full resize-none px-3 pt-2 pb-1.5 text-sm bg-transparent focus:outline-none placeholder:text-gray-400"
        />

        <div className="flex items-center justify-between px-2.5 pb-2.5">
          <div className="flex items-center gap-1.5">
            <div className="relative">
              <button onClick={() => setActivePopover(activePopover === "template" ? null : "template")} className="flex items-center gap-1 px-2 py-1.5 rounded-md text-xs font-medium text-gray-600 hover:bg-gray-100">
                <FileText className="w-3.5 h-3.5" /> Template
              </button>
              {activePopover === "template" && (
                <div className="absolute left-0 bottom-full mb-2 w-72 bg-white rounded-lg border border-gray-200 shadow-xl z-20 p-2">
                  <div className="px-1 pb-2 text-xs font-semibold text-gray-500">Templates</div>
                  <div className="relative mb-2">
                    <Search className="w-3.5 h-3.5 text-gray-400 absolute left-2.5 top-1/2 -translate-y-1/2" />
                    <input autoFocus value={templateSearch} onChange={(e) => setTemplateSearch(e.target.value)} placeholder="Search templates..." className="w-full pl-7 pr-2 py-1.5 text-sm rounded-md border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-200" />
                  </div>
                  <div className="max-h-56 overflow-y-auto">
                    {["Home Insurance", "General"].map((cat) => {
                      const items = allTemplates.filter((t) => t.cat === cat);
                      if (items.length === 0) return null;
                      return (
                        <div key={cat} className="mb-1">
                          <div className="px-2 pt-1.5 pb-0.5 text-[11px] font-semibold text-gray-400 uppercase tracking-wide">{cat}</div>
                          {items.map((t) => (
                            <button key={t.name} onClick={() => insertTemplate(t.body)} className="w-full text-left px-2.5 py-1.5 text-sm rounded-md hover:bg-orange-50 text-gray-700">
                              {t.name}
                            </button>
                          ))}
                        </div>
                      );
                    })}
                    {allTemplates.length === 0 && <div className="px-2 py-3 text-xs text-gray-400 text-center">No templates found</div>}
                  </div>
                </div>
              )}
            </div>

            <input ref={fileInputRef} type="file" multiple className="hidden" onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }} />
            <button onClick={() => fileInputRef.current?.click()} className="flex items-center gap-1 px-2 py-1.5 rounded-md text-xs font-medium text-gray-600 hover:bg-gray-100">
              <Paperclip className="w-3.5 h-3.5" /> Attach
            </button>

            <div className="relative">
              <button onClick={() => setActivePopover(activePopover === "aiMenu" ? null : "aiMenu")} className="flex items-center gap-1 px-2 py-1.5 rounded-md text-xs font-medium text-gray-600 hover:bg-gray-100">
                <Sparkles className="w-3.5 h-3.5" /> AI Assist
              </button>
              {activePopover === "aiMenu" && (
                <div className="absolute left-0 bottom-full mb-2 w-52 bg-white rounded-lg border border-gray-200 shadow-xl z-20 py-1.5">
                  {AI_ACTIONS.map((action) => (
                    <button
                      key={action.id}
                      onClick={() => runAiAssist(action)}
                      className="w-full text-left px-3 py-1.5 text-sm text-gray-700 hover:bg-orange-50 hover:text-orange-700"
                    >
                      {action.label}
                    </button>
                  ))}
                  <div className="flex items-center gap-1 px-3 pt-1.5 mt-1 border-t border-gray-100">
                    <span className="w-4 h-4 rounded bg-gray-900 flex items-center justify-center shrink-0">
                      <span className="text-[8px] font-bold text-white">AI</span>
                    </span>
                    <span className="text-[10px] text-gray-400">Results are AI-generated</span>
                  </div>
                </div>
              )}
            </div>
          </div>

          <div className="flex items-center gap-1.5">
            <div className="relative">
              <button onClick={() => setActivePopover(activePopover === "emoji" ? null : "emoji")} className="w-7 h-7 rounded-md flex items-center justify-center text-gray-500 hover:bg-gray-100">
                <Smile className="w-4 h-4" />
              </button>
              {activePopover === "emoji" && (
                <div className="absolute right-0 bottom-full mb-2 w-56 bg-white rounded-lg border border-gray-200 shadow-xl z-20 p-2 grid grid-cols-6 gap-1">
                  {EMOJIS.map((e) => (
                    <button key={e} onClick={() => setText((t) => t + e)} className="text-lg leading-none w-8 h-8 rounded-md hover:bg-gray-100 flex items-center justify-center">
                      {e}
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div className="relative flex items-center">
              <button
                onClick={doSend}
                disabled={!text.trim() && attachments.length === 0}
                className={`flex items-center gap-1.5 pl-3 pr-2 py-1.5 text-white text-sm font-medium disabled:opacity-40 disabled:cursor-not-allowed ${mode === "note" ? "rounded-md bg-amber-600 hover:bg-amber-700" : "rounded-l-md bg-orange-600 hover:bg-orange-700"}`}
              >
                {mode === "note" ? <Edit3 className="w-3.5 h-3.5" /> : <Send className="w-3.5 h-3.5" />}
                {mode === "note" ? "Add Note" : "Send"}
              </button>
              {mode === "reply" && (
                <button onClick={() => setActivePopover(activePopover === "schedule" ? null : "schedule")} className="px-1.5 py-1.5 rounded-r-md bg-orange-600 border-l border-orange-500 text-white hover:bg-orange-700">
                  <ChevronDown className="w-3.5 h-3.5" />
                </button>
              )}
              {activePopover === "schedule" && mode === "reply" && (
                <div className="absolute right-0 bottom-full mb-2 w-72 bg-white rounded-lg border border-gray-200 shadow-xl z-20 p-4">
                  <div className="flex items-center gap-1.5 mb-3">
                    <Clock className="w-3.5 h-3.5 text-orange-500" />
                    <span className="text-sm font-semibold text-gray-900">Schedule send</span>
                  </div>

                  <div className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-medium text-gray-400 uppercase tracking-wide mb-1">Date</label>
                      <input
                        type="date"
                        value={scheduleDate}
                        onChange={(e) => setScheduleDate(e.target.value)}
                        className="schedule-input w-full h-9 px-2.5 text-sm text-gray-700 rounded-md border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-200 focus:border-orange-400 focus:bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-medium text-gray-400 uppercase tracking-wide mb-1">Time</label>
                      <input
                        type="time"
                        value={scheduleTime}
                        onChange={(e) => setScheduleTime(e.target.value)}
                        className="schedule-input w-full h-9 px-2.5 text-sm text-gray-700 rounded-md border border-gray-200 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-orange-200 focus:border-orange-400 focus:bg-white"
                      />
                    </div>
                  </div>

                  {scheduleDate && (
                    <p className="mt-2.5 text-xs text-gray-500">
                      Sends {new Date(scheduleDate + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}
                      {scheduleTime ? ` at ${new Date("2000-01-01T" + scheduleTime).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}` : ""}
                    </p>
                  )}

                  <div className="flex gap-2 mt-4">
                    <button onClick={() => setActivePopover(null)} className="flex-1 py-1.5 rounded-md border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50">
                      Cancel
                    </button>
                    <button
                      onClick={() => { setActivePopover(null); addToast(scheduleDate ? `Message scheduled for ${scheduleDate}${scheduleTime ? " " + scheduleTime : ""}` : "Message scheduled", "success"); setText(""); setAttachments([]); }}
                      disabled={!text.trim() && attachments.length === 0}
                      className="flex-1 py-1.5 rounded-md bg-orange-600 text-white text-sm font-medium hover:bg-orange-700 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-orange-600"
                    >
                      Schedule
                    </button>
                  </div>
                  <style>{`.schedule-input::-webkit-calendar-picker-indicator{opacity:0.55;cursor:pointer;filter:none}.schedule-input::-webkit-calendar-picker-indicator:hover{opacity:0.85}`}</style>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
      <p className="text-[11px] text-gray-300 mt-1.5 px-1">Press / to insert template · Shift + Enter to new line · JPG, PNG, GIF, PDF, MP3, VCF up to 5 MB</p>
    </div>
  );
}

        <div className="space-y-4 text-sm">

            <div className="text-xs font-medium text-gray-400 mb-1">Stage</div>
            <span className={`inline-block text-xs px-2 py-1 rounded border font-medium ${STAGE_STYLES[pipeline.stage]}`}>{pipeline.stage}</span>
          </div>

          {!editing ? (
            <>
              <div>

              </div>
              <div>

                  <div className="text-xs font-medium text-gray-400 mb-1">Amount</div>
                  <div className="text-gray-800">{pipeline.amount}</div>
                </div>
              )}
            </>
          ) : (
            <>
              <div>
                <label className="text-xs font-medium text-gray-400 mb-1 block">Due Date</label>
                <input value={dueDate} onChange={(e) => setDueDate(e.target.value)} className="w-full px-2.5 py-1.5 text-sm rounded-md border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-200" />
              </div>
              <div>
                <label className="text-xs font-medium text-gray-400 mb-1 block">Owner</label>
                <select value={owner} onChange={(e) => setOwner(e.target.value)} className="w-full px-2.5 py-1.5 text-sm rounded-md border border-gray-200 bg-white focus:outline-none focus:ring-2 focus:ring-orange-200">
                  {AGENTS.map((a) => <option key={a}>{a}</option>)}
                </select>
              </div>
              <div className="flex gap-2 pt-1">
                <button onClick={() => setEditing(false)} className="px-3 py-1.5 text-xs rounded-md border border-gray-300 text-gray-600">Cancel</button>
                <button onClick={() => { onEditSave({ dueDate, owner }); setEditing(false); }} className="px-3 py-1.5 text-xs rounded-md bg-orange-600 text-white">Save</button>
              </div>
            </>
          )}
        </div>

        {!editing && (
          <div className="mt-5 flex flex-wrap gap-2">
            <button onClick={() => setChangingStage((v) => !v)} className="px-3 py-1.5 text-xs rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50 flex items-center gap-1.5">
              <Target className="w-3.5 h-3.5" /> Change Stage

              <StickyNote className="w-3.5 h-3.5" /> Add Note
            </button>
            <button onClick={() => setEditing(true)} className="px-3 py-1.5 text-xs rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50 flex items-center gap-1.5">
              <Edit3 className="w-3.5 h-3.5" /> Edit
            </button>
          </div>
        )}

        {changingStage && (
          <div className="mt-3 flex flex-wrap gap-1.5">
            {STAGES.map((s) => (
              <button key={s} onClick={() => { onChangeStage(s); setChangingStage(false); }} className={`text-xs px-2.5 py-1.5 rounded-md border font-medium ${s === pipeline.stage ? STAGE_STYLES[s] : "border-gray-200 text-gray-500 hover:bg-gray-50"}`}>
                {s}
              </button>
            ))}
          </div>
        )}

        {addingNote && (
          <div className="mt-3">
            <textarea value={noteText} onChange={(e) => setNoteText(e.target.value)} rows={3} placeholder="Add a note..." className="w-full px-2.5 py-2 text-sm rounded-md border border-gray-200 focus:outline-none focus:ring-2 focus:ring-orange-200" />

              onClick={() => { if (noteText.trim()) { onAddNote(noteText.trim()); setNoteText(""); setAddingNote(false); } }}

            >
              Save Note
            </button>
          </div>
        )}

        {pipeline.notes && pipeline.notes.length > 0 && (
          <div className="mt-5">
            <div className="text-xs font-medium text-gray-400 mb-2">Notes</div>
            <div className="space-y-2">
              {pipeline.notes.map((n, i) => (
                <div key={i} className="text-sm bg-gray-50 border border-gray-100 rounded-md px-3 py-2 text-gray-700">{n}</div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function ActivityIcon({ type }) {
  if (type === "call") return <Phone className="w-3.5 h-3.5 text-gray-500" />;
  if (type === "text") return <MessageSquare className="w-3.5 h-3.5 text-gray-500" />;
  if (type === "task") return <CheckSquare className="w-3.5 h-3.5 text-gray-500" />;
  if (type === "meeting") return <Calendar className="w-3.5 h-3.5 text-gray-500" />;
  if (type === "file") return <Paperclip className="w-3.5 h-3.5 text-gray-500" />;
  return <Mail className="w-3.5 h-3.5 text-gray-500" />;

      <div className="px-4 py-3 border-t border-gray-100">

          View Full Profile <ExternalLink className="w-3.5 h-3.5" />

      </div>
    </div>
  );
}

  const [isRefreshing, setIsRefreshing] = useState(false);
  const [activePopover, setActivePopover] = useState(null);
  const [composerMode, setComposerMode] = useState("reply");
  const [toasts, setToasts] = useState([]);
  const [showNewMessage, setShowNewMessage] = useState(false);
  const [showFullProfile, setShowFullProfile] = useState(false);
  const [openPipeline, setOpenPipeline] = useState(null);
  const [addingPipeline, setAddingPipeline] = useState(false);
  const [openPolicy, setOpenPolicy] = useState(null);
  const [viewAllPolicies, setViewAllPolicies] = useState(false);
  const [viewAllActivities, setViewAllActivities] = useState(false);
  const [selectedIds, setSelectedIds] = useState([]);

  const threadRef = useRef(null);

  const conv = conversations.find((c) => c.id === selectedId);

  const addToast = (message, type = "success") => {
    const id = nextId();
    setToasts((t) => [...t, { id, message, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3000);
  };

  const updateConv = (id, patch) => {
    setConversations((prev) => prev.map((c) => (c.id === id ? { ...c, ...(typeof patch === "function" ? patch(c) : patch) } : c)));
  };

  useEffect(() => {
    if (threadRef.current) threadRef.current.scrollTop = threadRef.current.scrollHeight;
  }, [selectedId, conv?.messages?.length]);

  const handleSelect = (id) => {
    setSelectedId(id);
    setActivePopover(null);
    setOpenPipeline(null);
    updateConv(id, { unread: 0 });
  };

  const handleSend = ({ text, attachments, type }) => {
    const time = nowTime();
    const isNote = type === "note";
    const newMsgs = [];
    if (text) newMsgs.push({ id: nextId(), sender: "agent", text, time, status: isNote ? undefined : "Sent", type: isNote ? "note" : undefined });
    attachments.forEach((a) => newMsgs.push({ id: nextId(), sender: "agent", text: "", time, status: isNote ? undefined : "Sent", attachment: a, type: isNote ? "note" : undefined }));
    updateConv(conv.id, (c) => ({
      messages: [...c.messages, ...newMsgs],
      ...(isNote ? {} : { lastMessage: text || (attachments[0] ? attachments[0].name : c.lastMessage), lastTime: time }),
    }));
    addToast(isNote ? "Note added" : "Message sent", "success");
  };

  const handleRefresh = () => {
    setIsRefreshing(true);
    setTimeout(() => { setIsRefreshing(false); addToast("Messages refreshed", "success"); }, 700);
  };

  const handleAssign = (agent) => {
    updateConv(conv.id, { assignedAgent: agent });
    setActivePopover(null);
    addToast("Agent assigned successfully", "success");
  };

  const handleToggleMute = () => {
    const willMute = !conv.muted;
    updateConv(conv.id, { muted: willMute });
    addToast(willMute ? "Notifications muted" : "Notifications unmuted", "success");
  };

  const handleMarkUnread = () => {
    const willBeUnread = conv.unread === 0;
    updateConv(conv.id, { unread: willBeUnread ? 1 : 0 });
    addToast(willBeUnread ? "Conversation marked as unread" : "Conversation marked as read", "success");
  };

  const handleCloseConversation = () => {
    const closingId = conv.id;
    updateConv(closingId, { closed: true });
    addToast("Conversation closed", "success");
    const next = conversations.find((c) => c.id !== closingId && !c.closed) || conversations.find((c) => c.id !== closingId);
    if (next) handleSelect(next.id);
  };

  const archiveConversations = (ids) => {
    setConversations((prev) => prev.map((c) => (ids.includes(c.id) ? { ...c, archived: true } : c)));
    if (ids.includes(selectedId)) {
      const next = conversations.find((c) => !ids.includes(c.id) && !c.archived);
      if (next) setSelectedId(next.id);
    }
  };

  const handleArchive = () => {
    archiveConversations([conv.id]);
    setActivePopover(null);
    addToast("Conversation archived", "success");
  };

  const handleToggleFavorite = () => {
    const willFav = !conv.favorite;
    updateConv(conv.id, { favorite: willFav });
    addToast(willFav ? "Added to favorites" : "Removed from favorites", "success");
  };

  const toggleSelectId = (id) => {
    setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  };

  const bulkMarkRead = () => {
    setConversations((prev) => prev.map((c) => (selectedIds.includes(c.id) ? { ...c, unread: 0 } : c)));
    addToast(`${selectedIds.length} conversation${selectedIds.length === 1 ? "" : "s"} marked as read`, "success");
    setSelectedIds([]);
  };

  const bulkMarkUnread = () => {
    setConversations((prev) => prev.map((c) => (selectedIds.includes(c.id) ? { ...c, unread: Math.max(1, c.unread) } : c)));
    addToast(`${selectedIds.length} conversation${selectedIds.length === 1 ? "" : "s"} marked as unread`, "success");
    setSelectedIds([]);
  };

  const bulkArchive = () => {
    const count = selectedIds.length;
    archiveConversations(selectedIds);
    addToast(`${count} conversation${count === 1 ? "" : "s"} archived`, "success");
    setSelectedIds([]);
  };

  const handleSelectAll = (shouldSelect, visibleIds) => {
    setSelectedIds(shouldSelect ? visibleIds : []);
  };

  const handleUnarchiveOne = (id) => {
    setConversations((prev) => prev.map((c) => (c.id === id ? { ...c, archived: false } : c)));
    addToast("Conversation restored from archive", "success");
  };

  const handleToggleFavoriteOne = (id) => {
    let willFav = false;
    setConversations((prev) => prev.map((c) => {
      if (c.id !== id) return c;
      willFav = !c.favorite;
      return { ...c, favorite: willFav };
    }));
    addToast(willFav ? "Added to favorites" : "Removed from favorites", "success");
  };

  const handleAddPipeline = (pipeline) => {
    updateConv(conv.id, (c) => ({ pipelines: [...c.pipelines, pipeline] }));
    setAddingPipeline(false);
    addToast("Pipeline added", "success");
  };

  const logActivity = (activity) => {
    updateConv(conv.id, (c) => ({ activities: [activity, ...c.activities] }));
  };

  const handleQuickNote = () => {
    setComposerMode("note");
    addToast("Composer switched to Note", "success");
  };

  const handleQuickEmail = () => {
    logActivity({ icon: "email", title: "Email started", detail: `Draft to ${conv.email}`, when: nowActivityTime() });
    addToast(`Drafting an email to ${conv.name}...`, "success");
  };

  const handleQuickCall = () => {
    logActivity({ icon: "call", title: "Call started", detail: `Outbound call to ${conv.phone}`, when: nowActivityTime() });
    addToast(`Calling ${conv.name}...`, "success");
  };

  const handleQuickTask = () => {
    logActivity({ icon: "task", title: "Task created", detail: `Follow up with ${conv.name}`, when: nowActivityTime() });
    addToast("Task created", "success");
  };

  const handleQuickMeeting = () => {
    logActivity({ icon: "meeting", title: "Meeting scheduled", detail: `Call with ${conv.name}`, when: nowActivityTime() });
    addToast("Meeting scheduled", "success");
  };

  const handleQuickFiles = (files) => {
    Array.from(files).forEach((file) => {
      const ext = file.name.split(".").pop().toLowerCase();
      if (!ALLOWED_EXT.includes(ext)) { addToast("File type not supported", "error"); return; }
      if (file.size > MAX_FILE_BYTES) { addToast("File exceeds 5 MB limit", "error"); return; }
      logActivity({ icon: "file", title: "File uploaded", detail: file.name, when: nowActivityTime() });
      addToast("File uploaded successfully", "success");
    });
  };

  const handleChangeStage = (stage) => {
    updateConv(conv.id, (c) => ({ pipelines: c.pipelines.map((p) => (p.id === openPipeline.id ? { ...p, stage } : p)) }));
    setOpenPipeline((p) => ({ ...p, stage }));
    addToast(`Stage updated to ${stage}`, "success");
  };

  const handleAddNote = (note) => {
    updateConv(conv.id, (c) => ({ pipelines: c.pipelines.map((p) => (p.id === openPipeline.id ? { ...p, notes: [...p.notes, note] } : p)) }));
    setOpenPipeline((p) => ({ ...p, notes: [...p.notes, note] }));
    addToast("Note added", "success");
  };

  const handleEditPipeline = (patch) => {
    updateConv(conv.id, (c) => ({ pipelines: c.pipelines.map((p) => (p.id === openPipeline.id ? { ...p, ...patch } : p)) }));
    setOpenPipeline((p) => ({ ...p, ...patch }));
    addToast("Pipeline updated", "success");
  };

  if (!conv) return null;

  return (
    <div className="h-screen w-full flex bg-gray-50 text-gray-900 overflow-hidden border border-gray-200">
      <IconRail />

      <ConversationList
        conversations={conversations}
        selectedId={selectedId}
        onSelect={handleSelect}
        query={query}
        setQuery={setQuery}
        filter={filter}
        setFilter={setFilter}
        agentFilters={agentFilters}
        setAgentFilters={setAgentFilters}
        dateFilter={dateFilter}
        setDateFilter={setDateFilter}
        customDateFrom={customDateFrom}
        setCustomDateFrom={setCustomDateFrom}
        customDateTo={customDateTo}
        setCustomDateTo={setCustomDateTo}
        favoriteFilter={favoriteFilter}
        setFavoriteFilter={setFavoriteFilter}
        activityFilter={activityFilter}
        setActivityFilter={setActivityFilter}
        selectedIds={selectedIds}
        onToggleSelectId={toggleSelectId}
        onSelectAll={handleSelectAll}
        onBulkMarkRead={bulkMarkRead}
        onBulkMarkUnread={bulkMarkUnread}
        onBulkArchive={bulkArchive}
        onUnarchiveOne={handleUnarchiveOne}
        onToggleFavoriteOne={handleToggleFavoriteOne}
      />

      <div className="flex-1 min-w-0 flex flex-col bg-white border-r border-gray-200 overflow-x-hidden">
        <ConversationHeader
          conv={conv}
          isRefreshing={isRefreshing}
          onRefresh={handleRefresh}
          onToggleFavorite={handleToggleFavorite}
          onCloseConversation={handleCloseConversation}
          onProfileToggle={() => setShowProfilePanel((v) => !v)}
          showProfilePanel={showProfilePanel}
          activePopover={activePopover}
          setActivePopover={setActivePopover}
          onAssign={handleAssign}
          onMarkUnread={handleMarkUnread}
          onToggleMute={handleToggleMute}
          onArchive={handleArchive}
        />

        <div ref={threadRef} className="flex-1 overflow-y-auto overflow-x-hidden px-5 py-4 bg-slate-50">
          <div className="flex justify-center mb-4">
            <span className="text-[11px] text-gray-400 bg-gray-100 px-2.5 py-1 rounded-full">{conv.messages[0]?.time?.includes(":") ? "May 16, 2025" : conv.messages[0]?.time}</span>
          </div>
          {conv.messages.map((m) => (
            <React.Fragment key={m.id}>
              {m.isNew && (
                <div className="flex items-center gap-3 my-4">
                  <div className="flex-1 h-px bg-orange-200" />
                  <span className="text-[11px] font-semibold text-orange-500 uppercase tracking-wide">New Messages</span>
                  <div className="flex-1 h-px bg-orange-200" />
                </div>
              )}
              <MessageBubble msg={m} />
            </React.Fragment>
          ))}
        </div>

        <Composer conv={conv} onSend={handleSend} addToast={addToast} activePopover={activePopover} setActivePopover={setActivePopover} mode={composerMode} setMode={setComposerMode} />
      </div>

      <div className={`relative flex shrink-0 ${showProfilePanel ? "" : "w-3"}`}>
        <Tooltip label={showProfilePanel ? "Collapse client details" : "Expand client details"}>
          <button
            onClick={() => setShowProfilePanel((v) => !v)}
            className="absolute -left-3 top-[18px] z-20 w-6 h-6 rounded-full border-2 border-gray-700 bg-white flex items-center justify-center text-gray-700 hover:bg-gray-100 shadow-sm"
          >
            {showProfilePanel ? <ChevronRight className="w-3.5 h-3.5" strokeWidth={2.5} /> : <ChevronLeft className="w-3.5 h-3.5" strokeWidth={2.5} />}
          </button>
        </Tooltip>
        {showProfilePanel && (
        <ProfilePanel
          conv={conv}
          onOpenPipeline={setOpenPipeline}
          onOpenPolicy={setOpenPolicy}
          onFullProfile={() => setShowFullProfile(true)}
          onQuickNote={handleQuickNote}
          onQuickEmail={handleQuickEmail}
          onQuickCall={handleQuickCall}
          onQuickTask={handleQuickTask}
          onQuickMeeting={handleQuickMeeting}
          onQuickFiles={handleQuickFiles}
        />
        )}
      </div>

      {activePopover && <div className="fixed inset-0 z-10" onClick={() => setActivePopover(null)} />}

      <ToastStack toasts={toasts} />

      {addingPipeline && <AddPipelineModal onCancel={() => setAddingPipeline(false)} onAdd={handleAddPipeline} />}

      {openPipeline && (
        <PipelineDetailDrawer
          pipeline={openPipeline}
          onClose={() => setOpenPipeline(null)}
          onChangeStage={handleChangeStage}
          onAddNote={handleAddNote}
          onEditSave={handleEditPipeline}
        />
      )}

      {openPolicy && <PolicyDrawer policy={openPolicy} onClose={() => setOpenPolicy(null)} />}

      {viewAllPolicies && (
        <ListModal title={`Policies (${conv.policies.length})`} onClose={() => setViewAllPolicies(false)}>
          <div className="space-y-2">
            {conv.policies.map((p) => (
              <button key={p.number} onClick={() => { setViewAllPolicies(false); setOpenPolicy(p); }} className="w-full text-left rounded-md border border-gray-200 px-3 py-2.5 hover:border-orange-200 hover:bg-orange-50/40 flex items-start gap-2.5">
                <SectionIcon icon={ClipboardList} accent />
                <div className="flex-1 min-w-0">
                  <div className="flex items-center justify-between gap-2">
                    <span className="text-sm font-medium text-gray-800 truncate">{p.type}</span>
                    <span className={`text-[10px] px-1.5 py-0.5 rounded-full border font-medium shrink-0 ${p.status === "Active" ? "bg-emerald-50 text-emerald-700 border-emerald-200" : "bg-amber-50 text-amber-700 border-amber-200"}`}>{p.status}</span>
                  </div>
                  <div className="text-xs text-gray-400 mt-0.5">{p.number} · Renewal {p.renewal}</div>
                </div>
              </button>
            ))}
          </div>
        </ListModal>
      )}

      {viewAllActivities && (
        <ListModal title="Recent Activities" onClose={() => setViewAllActivities(false)}>
          <div className="space-y-3">
            {conv.activities.map((a, i) => (
              <div key={i} className="flex items-start gap-2.5">
                <div className="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center shrink-0 mt-0.5"><ActivityIcon type={a.icon} /></div>
                <div>
                  <div className="text-sm text-gray-800">{a.title}</div>
                  <div className="text-xs text-gray-400">{a.detail}</div>
                  <div className="text-[11px] text-gray-300">{a.when}</div>
                </div>
              </div>
            ))}
          </div>
        </ListModal>
      )}

      {showFullProfile && <FullProfileModal conv={conv} onClose={() => setShowFullProfile(false)} />}

      {showNewMessage && (
        <NewMessageModal
          conversations={conversations}
          onClose={() => setShowNewMessage(false)}
          onPick={(id) => { handleSelect(id); setShowNewMessage(false); addToast("Conversation opened", "success"); }}
        />
      )}
    </div>
  );
}


const root = createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
